<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="t d">
<title id="t">DORAI AI loading mark</title>
<desc id="d">The forward core pulses while two rings expand outward from it, on a seamless 1.8 second loop.</desc>
<defs>
  <linearGradient id="pgrad" x1="214" y1="200" x2="308" y2="312" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25E2F5"/><stop offset="1" stop-color="#377CFF"/></linearGradient>
  <style>
    .ring{fill:none;stroke:#25E2F5;stroke-width:2.4;vector-effect:non-scaling-stroke;
          transform-box:fill-box;transform-origin:50% 50%;opacity:0;
          animation:pulse 1.8s cubic-bezier(.25,.7,.35,1) infinite}
    .ring2{animation-delay:.9s}
    .core{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 1.8s ease-in-out infinite}
    @keyframes pulse{0%{transform:scale(.24);opacity:.9}60%{opacity:.2}100%{transform:scale(1);opacity:0}}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    @media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:.3;transform:none}.ring2{display:none}.core{animation:none}}
  </style>
</defs>
<circle class="ring" cx="64" cy="64" r="52"/>
<circle class="ring ring2" cx="64" cy="64" r="52"/>
<g transform="translate(-62.5,-63) scale(.5)">
  <path class="core" d="M214.0 223.0 Q214 201 233.0 212.1 L289.0 244.9 Q308 256 289.0 267.1 L233.0 299.9 Q214 311 214.0 289.0 Z" fill="url(#pgrad)"/>
</g>
</svg>
