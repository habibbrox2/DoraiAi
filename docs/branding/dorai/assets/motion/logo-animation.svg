<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">DORAI AI animated mark</title>
<desc id="desc">The DORAI AI D mark sweeps in from the left, its forward core lands with a soft glow, then the mark breathes.</desc>
<defs>
  <linearGradient id="dgrad" x1="84" y1="60" x2="440" y2="452" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25E2F5"/><stop offset=".48" stop-color="#377CFF"/><stop offset="1" stop-color="#6F5BFF"/></linearGradient>
  <linearGradient id="pgrad" x1="214" y1="200" x2="308" y2="312" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25E2F5"/><stop offset="1" stop-color="#377CFF"/></linearGradient>
  <radialGradient id="coreGlow" cx="261" cy="256" r="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25E2F5" stop-opacity=".55"/><stop offset=".55" stop-color="#377CFF" stop-opacity=".22"/><stop offset="1" stop-color="#377CFF" stop-opacity="0"/></radialGradient>
  <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <rect class="wipe" x="76" y="40" width="372" height="432" fill="#fff"/>
  </mask>
  <style>
    .wipe{transform-box:view-box;transform-origin:76px 256px;animation:wipe-in .9s cubic-bezier(.22,.86,.24,1) both}
    .core{transform-box:fill-box;transform-origin:50% 50%;animation:core-in .52s cubic-bezier(.34,1.56,.64,1) .82s both,breathe 4.2s ease-in-out 1.6s infinite}
    .halo{transform-box:fill-box;transform-origin:50% 50%;animation:halo-in 1.15s ease-out .8s both}
    @keyframes wipe-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes core-in{from{opacity:0;transform:scale(.42)}62%{opacity:1;transform:scale(1.07)}to{opacity:1;transform:scale(1)}}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes halo-in{0%{opacity:0;transform:scale(.62)}30%{opacity:1}to{opacity:0;transform:scale(1.42)}}
    @media (prefers-reduced-motion:reduce){.wipe,.core,.halo{animation:none}}
  </style>
</defs>
<g mask="url(#reveal)">
  <path d="M118 60 H244 C352.25 60 440 147.75 440 256 C440 364.25 352.25 452 244 452 H118 C99 452 84 437 84 418 V94 C84 79 103 60 118 60 Z M164 140.0 V372.0 H244 C308.07 372.0 360.0 320.07 360.0 256 C360.0 191.93 308.07 140.0 244 140.0 Z" fill="url(#dgrad)" fill-rule="evenodd"/>
</g>
<circle class="halo" cx="261" cy="256" r="120" fill="url(#coreGlow)"/>
<path class="core" d="M214.0 223.0 Q214 201 233.0 212.1 L289.0 244.9 Q308 256 289.0 267.1 L233.0 299.9 Q214 311 214.0 289.0 Z" fill="url(#pgrad)"/>
</svg>
