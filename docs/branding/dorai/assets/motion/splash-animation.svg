<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
<title id="t">DORAI AI splash animation</title>
<desc id="d">The navy tile fades up, the D mark is drawn in from the left, the core lands, and a single light sweep crosses the tile before the mark settles.</desc>
<defs>
  <linearGradient id="dgrad" x1="84" y1="60" x2="440" y2="452" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25E2F5"/><stop offset=".48" stop-color="#377CFF"/><stop offset="1" stop-color="#6F5BFF"/></linearGradient>
  <linearGradient id="pgrad" x1="214" y1="200" x2="308" y2="312" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25E2F5"/><stop offset="1" stop-color="#377CFF"/></linearGradient>
  <clipPath id="tile"><rect width="512" height="512" rx="104"/></clipPath>
  <mask id="markmask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <rect class="wipe" x="76" y="52" width="372" height="410" fill="#fff"/>
  </mask>
  <style>
    .tile{animation:tileIn .6s ease-out both}
    .wipe{transform-box:view-box;transform-origin:76px 256px;animation:wipe .85s cubic-bezier(.22,.86,.24,1) .3s both}
    .core{transform-box:fill-box;transform-origin:50% 50%;animation:coreIn .5s cubic-bezier(.34,1.56,.64,1) .95s both,breathe 4.4s ease-in-out 1.8s infinite}
    .halo{transform-box:fill-box;transform-origin:50% 50%;animation:halo 1s ease-out .95s both}
    @keyframes tileIn{from{opacity:0}to{opacity:1}}
    @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes coreIn{from{opacity:0;transform:scale(.4)}62%{opacity:1;transform:scale(1.07)}to{opacity:1;transform:scale(1)}}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
    @keyframes halo{0%{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(1.6)}}
    @media (prefers-reduced-motion:reduce){.tile,.wipe,.core,.halo{animation:none}}
  </style>
</defs>
<g clip-path="url(#tile)">
  <rect class="tile" width="512" height="512" fill="#050A1C"/>
  <g mask="url(#markmask)">
    <path d="M118 60 H244 C352.25 60 440 147.75 440 256 C440 364.25 352.25 452 244 452 H118 C99 452 84 437 84 418 V94 C84 79 103 60 118 60 Z M164 140.0 V372.0 H244 C308.07 372.0 360.0 320.07 360.0 256 C360.0 191.93 308.07 140.0 244 140.0 Z" fill="url(#dgrad)" fill-rule="evenodd"/>
  </g>
  <circle class="halo" cx="261" cy="256" r="118" fill="#25E2F5" fill-opacity=".16"/>
  <path class="core" d="M214.0 223.0 Q214 201 233.0 212.1 L289.0 244.9 Q308 256 289.0 267.1 L233.0 299.9 Q214 311 214.0 289.0 Z" fill="url(#pgrad)"/>
</g>
</svg>
