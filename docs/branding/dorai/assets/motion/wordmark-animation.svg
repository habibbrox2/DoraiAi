<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-labelledby="t d">
<title id="t">DORAI AI animated wordmark</title>
<desc id="d">The mark settles into place, the DORAI and AI words rise, and the underline draws under the lockup.</desc>
<defs>
  <linearGradient id="g" x1="80" y1="50" x2="430" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#25E2F5"/><stop offset=".48" stop-color="#377CFF"/><stop offset="1" stop-color="#6F5BFF"/></linearGradient>
  <linearGradient id="aig" x1="585" y1="80" x2="690" y2="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25E2F5"/><stop offset="1" stop-color="#377CFF"/></linearGradient>
  <linearGradient id="rule" x1="260" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25E2F5"/><stop offset="1" stop-color="#377CFF" stop-opacity="0"/></linearGradient>
  <style>
    .mark{transform-box:fill-box;transform-origin:50% 50%;animation:settle .8s cubic-bezier(.34,1.4,.64,1) both}
    .w1{animation:rise .7s cubic-bezier(.2,.85,.25,1) .45s both}
    .w2{animation:rise .7s cubic-bezier(.2,.85,.25,1) .58s both}
    .rule{transform-box:view-box;transform-origin:260px 0;animation:draw .7s cubic-bezier(.22,.86,.24,1) .95s both}
    @keyframes settle{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.mark,.w1,.w2,.rule{animation:none}}
  </style>
</defs>
<g transform="translate(-14,-6) scale(.46)">
 <g class="mark">
  <path d="M118 60 H244 C352.25 60 440 147.75 440 256 C440 364.25 352.25 452 244 452 H118 C99 452 84 437 84 418 V94 C84 79 103 60 118 60 Z M164 140.0 V372.0 H244 C308.07 372.0 360.0 320.07 360.0 256 C360.0 191.93 308.07 140.0 244 140.0 Z" fill="url(#g)" fill-rule="evenodd"/>
  <path d="M214.0 223.0 Q214 201 233.0 212.1 L289.0 244.9 Q308 256 289.0 267.1 L233.0 299.9 Q214 311 214.0 289.0 Z" fill="#377CFF"/>
 </g>
</g>
<g font-family="Inter, Arial, sans-serif" font-size="92" font-weight="750" letter-spacing="-3">
  <text class="w1" x="260" y="151" fill="#F5F8FC">DORAI</text>
  <text class="w2" x="585" y="151" fill="url(#aig)">AI</text>
</g>
<rect class="rule" x="260" y="172" width="500" height="5" rx="2.5" fill="url(#rule)"/>
</svg>
