  <text x="350" y="188" font-size="84" font-weight="800" letter-spacing="-2.5" fill="url(#aigrad)">AI</text>
  <rect x="72" y="210" width="368" height="5" rx="2.5" fill="url(#rule)"/>

  <text x="74" y="270" font-size="29" font-weight="400" fill="#DCE7F7">Intelligence, in every direction.</text>
  <text x="74" y="314" font-size="27" font-style="italic" font-weight="400" fill="#25E2F5">Your AI. Your World.</text>
  <text x="74" y="372" font-size="23" font-weight="400" fill="#9FB3CF">A unified space for thinking, creating,</text>
  <text x="74" y="404" font-size="23" font-weight="400" fill="#9FB3CF">building and getting things done.</text>

  <g font-size="13.5" font-weight="600" letter-spacing=".5">
<g><rect x="72" y="446" width="108" height="58" rx="13" fill="#0C1730" stroke="#377CFF" stroke-opacity=".35"/><text x="85" y="470" font-size="12.5" font-weight="600" letter-spacing="1" fill="#5E7FA8">01</text><text x="85" y="492" fill="#D8E6F8">CHAT</text></g>
<g><rect x="192" y="446" width="108" height="58" rx="13" fill="#0C1730" stroke="#377CFF" stroke-opacity=".35"/><text x="205" y="470" font-size="12.5" font-weight="600" letter-spacing="1" fill="#5E7FA8">02</text><text x="205" y="492" fill="#D8E6F8">AGENTS</text></g>
<g><rect x="312" y="446" width="108" height="58" rx="13" fill="#0C1730" stroke="#377CFF" stroke-opacity=".35"/><text x="325" y="470" font-size="12.5" font-weight="600" letter-spacing="1" fill="#5E7FA8">03</text><text x="325" y="492" fill="#D8E6F8">CODE</text></g>
<g><rect x="432" y="446" width="108" height="58" rx="13" fill="#0C1730" stroke="#377CFF" stroke-opacity=".35"/><text x="445" y="470" font-size="12.5" font-weight="600" letter-spacing="1" fill="#5E7FA8">04</text><text x="445" y="492" fill="#D8E6F8">AUTOMATE</text></g>
<g><rect x="552" y="446" width="108" height="58" rx="13" fill="#0C1730" stroke="#377CFF" stroke-opacity=".35"/><text x="565" y="470" font-size="12.5" font-weight="600" letter-spacing="1" fill="#5E7FA8">05</text><text x="565" y="492" fill="#D8E6F8">DISCOVER</text></g>
  </g>

  <rect x="72" y="536" width="396" height="56" rx="28" fill="none" stroke="#25E2F5" stroke-opacity=".55"/>
