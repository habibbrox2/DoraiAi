<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DORAI AI — UI v2 প্রোটোটাইপ</title>
<style>
:root{--page:#05070B;--bg:#150A2E;--surface:#241347;--surface2:#322059;--line:#43306E;--text:#F6F0FF;--muted:#B7A6DA;--primary:#FFC043;--on-primary:#2A1B00;--accent:#FF2E93;--ok:#34D399;--warn:#FBBF24;--err:#FB7185;--info:#22D3EE;--code:#0C0620;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:"Noto Sans Bengali","Hind Siliguri","Nirmala UI","Kohinoor Bangla",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}

/* toolbar */
.bar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;padding:12px 16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:4px 14px;border-radius:999px;min-height:36px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--on-primary);font-weight:600}
.sel{min-height:42px;border-radius:21px;border:1px solid var(--line);background:var(--surface);padding:4px 14px;font-size:14px}
.hint{font-size:13px;color:var(--muted);padding:0 16px 10px}
.stage{padding:0 16px 24px;overflow:hidden}
#wrap{margin:0 auto;position:relative}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:26px;overflow:hidden;border:1px solid var(--line)}

/* shell */
.app{position:relative;overflow:hidden;display:grid;height:100%;background:var(--bg);color:var(--text);font-size:calc(16px*var(--fs,1))}
.app[data-size=compact]{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"main" "nav"}
.app[data-size=medium],.app[data-size=expanded]{grid-template-columns:78px 250px minmax(0,1fr);grid-template-areas:"nav pane main"}
.app[data-size=expanded]{grid-template-columns:78px 270px minmax(0,1fr)}
.app[data-size=large]{grid-template-columns:224px 300px minmax(0,1fr);grid-template-areas:"nav pane main"}
.app.nopane[data-size=medium],.app.nopane[data-size=expanded]{grid-template-columns:78px minmax(0,1fr);grid-template-areas:"nav main"}
.app.nopane[data-size=large]{grid-template-columns:224px minmax(0,1fr);grid-template-areas:"nav main"}
.nav{grid-area:nav;background:var(--surface);border-top:1px solid var(--line);display:flex}
.app:not([data-size=compact]) .nav{flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 8px;gap:4px}
.ni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;min-height:64px;padding:8px 4px;color:var(--muted);font-size:12px;line-height:1.3;text-align:center;border-radius:16px;position:relative}
.ni[aria-current=true]{color:var(--text);font-weight:600}
.ni[aria-current=true] svg{background:color-mix(in srgb,var(--primary) 26%,transparent);color:var(--primary);border-radius:12px;padding:4px;width:42px;height:30px}
.ni .dot{position:absolute;top:8px;right:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.app:not([data-size=compact]) .ni{flex:none;min-height:56px}
.app[data-size=large] .ni{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:8px 14px;min-height:48px;text-align:left}
.app[data-size=large] .ni[aria-current=true]{background:color-mix(in srgb,var(--primary) 16%,transparent)}
.app[data-size=large] .ni[aria-current=true] svg{background:none;padding:0;width:22px;height:22px}
.app[data-size=large] .ni .dot{right:14px;top:18px}
.brandrow{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;justify-content:center}
.app[data-size=large] .brandrow{justify-content:flex-start}
.app:not([data-size=large]) .wordmark{display:none}
.grow{flex:1}
.pane{grid-area:pane;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.app[data-size=compact] .pane{grid-area:auto;position:absolute;left:0;top:0;bottom:0;width:min(330px,88%);z-index:30;transform:translateX(-102%);transition:transform .2s;background:var(--surface)}
.app[data-size=compact] .pane.open{transform:none}
.main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:25}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:56px;border-bottom:1px solid var(--line);background:var(--bg)}
.top h1{font-size:19px;line-height:1.4;margin:0;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text)}
.ib:hover{background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);max-width:100%;min-width:0}
.pill .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.4;padding:1px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.badge.local,.badge.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.badge.cloud,.badge.info{background:color-mix(in srgb,var(--info) 20%,transparent);color:var(--info)}
.badge.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.badge.err{background:color-mix(in srgb,var(--err) 22%,transparent);color:var(--err)}
.badge.mute{background:var(--surface2);color:var(--muted)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px}
.col{max-width:760px;margin:0 auto}
.col.wide{max-width:1000px}
.muted{color:var(--muted)}
h2{font-size:18px;line-height:1.5;margin:0 0 6px;font-weight:600}
h3{font-size:14px;margin:18px 0 8px;font-weight:600;color:var(--muted)}

/* buttons / flat vs 3D */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:6px 20px;border-radius:24px;font-weight:600;border:1px solid var(--line);background:var(--surface);transition:transform .08s}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.tonal{background:color-mix(in srgb,var(--primary) 20%,var(--surface));border-color:transparent}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 55%,transparent)}
.btn.text{border-color:transparent;background:none;color:var(--primary)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:4px 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:2px 14px;border-radius:20px;border:1px solid var(--line);font-size:14px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--primary) 22%,transparent);border-color:var(--primary);color:var(--text);font-weight:600}
html[data-style=d3] .btn:not(.text){box-shadow:0 4px 0 color-mix(in srgb,var(--line) 85%,#000),0 8px 14px rgba(0,0,0,.18)}
html[data-style=d3] .btn.primary{box-shadow:0 4px 0 color-mix(in srgb,var(--primary) 50%,#000),0 8px 14px rgba(0,0,0,.2)}
html[data-style=d3] .btn.accent{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 50%,#000),0 8px 14px rgba(0,0,0,.2)}
html[data-style=d3] .btn:not(.text):active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--line) 85%,#000)}
html[data-style=d3] .card,html[data-style=d3] .tcard,html[data-style=d3] .box,html[data-style=d3] .pill{box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 12%,transparent),0 4px 0 color-mix(in srgb,var(--line) 80%,#000),0 10px 16px rgba(0,0,0,.16)}
html[data-style=d3] .chip{box-shadow:0 3px 0 color-mix(in srgb,var(--line) 80%,#000)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card .r{display:flex;align-items:center;gap:12px}
.card .r .t{flex:1;min-width:0}
.card .t b{display:block;overflow-wrap:anywhere}
.card .t span{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.app:not([data-size=compact]) .grid.two{grid-template-columns:1fr 1fr}
.app[data-size=large] .grid.three{grid-template-columns:1fr 1fr 1fr}
.grid>.card{margin:0}
.stat{display:flex;gap:10px;align-items:center}
.stat b{font-size:26px;line-height:1.1}
.bar2{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--primary)}
.sw{width:52px;height:32px;border-radius:16px;background:var(--surface2);border:2px solid var(--muted);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:all .15s}
.sw[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked=true]::after{left:24px;background:var(--on-primary)}
.seg2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span:last-child{color:var(--muted);text-align:right}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:8px 14px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px}
.chk svg{flex:none;margin-top:3px}
.chk.ok svg{color:var(--ok)}.chk.bad svg{color:var(--err)}.chk.warn svg{color:var(--warn)}

/* list rows */
.phead{padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0 14px;min-height:44px;color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:0;padding:8px 0}
.plist{flex:1;overflow-y:auto;padding:0 8px 12px}
.plist h4{font-size:13px;font-weight:600;color:var(--muted);margin:14px 8px 4px}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:8px 12px;border-radius:14px}
.li:hover{background:var(--surface2)}
.li[aria-current=true]{background:color-mix(in srgb,var(--primary) 18%,transparent)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pill tabs (settings / project) */
.pilltabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:6px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.pilltabs button{flex:none;min-height:44px;padding:4px 18px;border-radius:22px;color:var(--muted);border:2px solid transparent;display:inline-flex;align-items:center;gap:8px}
.pilltabs button[aria-selected=true]{border-color:var(--info);background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info);font-weight:600}

/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px}
.msgs .col{display:flex;flex-direction:column;gap:18px}
.msg.user{display:flex;justify-content:flex-end}
.bub{background:var(--surface2);padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.ai .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;color:var(--muted)}
.ai p{margin:0 0 10px;overflow-wrap:anywhere}
.acts{display:flex;gap:2px;margin:2px 0 0 -10px}
.acts .ib{width:40px;height:40px;min-width:40px;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
.empty{text-align:center;padding:24px 8px 8px}
.empty h2{font-size:24px;margin-top:14px}
.qs{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px;text-align:left}
.app:not([data-size=compact]) .qs{grid-template-columns:1fr 1fr}
.qs button{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-height:64px}
.qs svg{color:var(--primary);flex:none;margin-top:2px}
.qs b{display:block;font-size:15px}.qs span{font-size:13px;color:var(--muted);line-height:1.45;display:block}
.composer{padding:8px 12px 12px;background:var(--bg);border-top:1px solid transparent}
.composer .col{display:flex;flex-direction:column;gap:6px}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.mdesc{font-size:13px;color:var(--muted);padding:0 4px}
.box{display:flex;align-items:flex-end;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:4px 6px}
.box:focus-within{border-color:var(--info)}
.box textarea{flex:1;border:0;background:none;resize:none;outline:0;min-height:44px;max-height:132px;padding:9px 6px;line-height:1.6}
.box textarea::placeholder{color:var(--muted)}
.send{background:var(--primary);color:var(--on-primary)}
.send:hover{background:var(--primary)}

/* tool cards / shell / approval */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.tcard.s-wait{border-color:var(--warn)}.tcard.s-fail{border-color:color-mix(in srgb,var(--err) 60%,var(--line))}
.thead{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;min-height:48px;text-align:left}
.thead .nm{font-weight:600;font-size:14px}
.thead .ar{flex:1;min-width:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--info) 30%,transparent);border-top-color:var(--info);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.tbody{padding:0 12px 12px;font-size:13px}
.sh{background:var(--code);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.55;margin:0;white-space:pre}
.sh .cm{color:var(--info)}.sh .er{color:var(--err)}
.diff{background:var(--code);border-radius:10px;padding:8px 0;font-size:12.5px;line-height:1.55;overflow-x:auto}
.diff div{padding:0 12px;white-space:pre}.diff .a{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.diff .d{background:color-mix(in srgb,var(--err) 18%,transparent);color:var(--err)}
.appr{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.appr .btn{flex:1;min-width:110px}
.appr-note{display:flex;gap:8px;align-items:center;color:var(--warn);font-weight:600;margin-bottom:8px}
.dyn{background:var(--surface);border:1px solid var(--info);border-radius:18px;padding:14px;margin:8px 0}
.dyn .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);margin-top:8px;min-height:56px}
.dyn .opt[aria-checked=true]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,transparent)}
.dyn .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:3px}
.dyn .opt[aria-checked=true] .rd{border-color:var(--primary);background:radial-gradient(var(--primary) 45%,transparent 50%)}
.plan li{padding:2px 0}

/* rail / timeline */
.rail{position:relative;margin:8px 0 8px}
.rail::before{content:"";position:absolute;left:15px;top:16px;bottom:16px;width:2px;background:linear-gradient(var(--info),var(--accent));opacity:.5;border-radius:2px}
.step{position:relative;padding:0 0 14px 46px;min-height:36px}
.node{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--muted);color:var(--muted)}
.s-ok .node{background:var(--ok);border-color:var(--ok);color:#06140E}
.s-run .node{border-color:var(--info);color:var(--info)}
.s-wait .node{background:var(--warn);border-color:var(--warn);color:#2A1B00}
.s-fail .node{border-color:var(--err);color:var(--err)}
.s-task .node{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.step .ti{padding-top:3px;overflow-wrap:anywhere}

/* workspace */
.pw{flex:1;min-height:0;display:flex}
.pcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.pcenter{flex:1}
.pagent{width:320px;border-left:1px solid var(--line);flex:none;background:var(--bg)}
.app[data-size=large] .pagent{width:380px}
.ptree{width:230px;border-right:1px solid var(--line);flex:none;overflow-y:auto;padding:8px}
.code{background:var(--code);flex:1;min-height:0;overflow:auto;font-size:13px;line-height:1.65;padding:8px 0}
.code div{display:flex;white-space:pre}
.code .n{width:44px;flex:none;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.code .add{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.ftabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px;scrollbar-width:none}
.ftabs button{padding:8px 14px;min-height:44px;color:var(--muted);border-bottom:2px solid transparent;font-size:14px;white-space:nowrap}
.ftabs button[aria-selected=true]{color:var(--text);border-color:var(--primary)}
.term{flex:1;min-height:0;overflow:auto;background:var(--code);padding:12px 14px;font-size:13px;line-height:1.55}
.term div{white-space:pre-wrap;overflow-wrap:anywhere}
.termin{display:flex;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);background:var(--code)}
.termin input{flex:1;border:0;background:none;outline:0;min-height:40px}
.gst{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.gst.M{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)}
.gst.A{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.gst.D{background:color-mix(in srgb,var(--err) 25%,transparent);color:var(--err)}

/* theme grid */
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.app[data-size=large] .tg,.app[data-size=expanded] .tg{grid-template-columns:repeat(4,1fr)}
.tp{text-align:left;display:block}
.tp .mk{border-radius:16px;border:2px solid var(--line);padding:10px;height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tp[aria-pressed=true] .mk{border-color:var(--info);box-shadow:0 0 0 2px color-mix(in srgb,var(--info) 40%,transparent)}
.tp .mk i{display:block;height:8px;border-radius:4px}
.tp .mk .row{display:flex;align-items:center;justify-content:space-between}
.tp .mk .d{display:inline-flex;gap:4px}.tp .mk .d b{width:8px;height:8px;border-radius:50%}
.tp .mk .pl{width:36px;height:16px;border-radius:8px}
.tp span{display:block;font-size:13px;margin-top:4px;color:var(--muted)}

/* sheets */
.sheet{position:absolute;z-index:40;background:var(--surface);display:flex;flex-direction:column;max-height:86%}
.app[data-size=compact] .sheet{left:0;right:0;bottom:0;border-radius:28px 28px 0 0;animation:up .22s}
.app:not([data-size=compact]) .sheet{left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92%);border-radius:24px;border:1px solid var(--line)}
.app:not([data-size=compact]) .sheet.pop{top:62px;transform:translateX(-50%);width:360px;border-radius:18px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px}

  if(t.s==='wait')body+=`<div class="appr-note" style="margin-top:10px">${ic('shield',18)}${L('এজেন্ট এই ধাপ চালাতে চায়। অনুমতি দেবেন?','The agent wants to run this step. Allow it?')}</div><div class="appr"><button class="btn primary sm" data-act="allow" data-v="${id}">${L('এবার অনুমতি','Allow once')}</button><button class="btn sm" data-act="allowses" data-v="${id}">${L('এই সেশনে','Allow for session')}</button><button class="btn danger sm" data-act="deny" data-v="${id}">${L('বাদ দিন','Deny')}</button></div>`;

function checks(){
 const u=S.url.trim();if(!u)return {ok:false,rows:[]};
 const https=/^https:\/\//i.test(u),loc=/^http:\/\/(localhost|127\.0\.0\.1|10\.0\.2\.2)(:|\/|$)/i.test(u),priv=/^https?:\/\/(192\.168\.|10\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.)/i.test(u),valid=/^https?:\/\/[^\s/]+\.?[^\s]*$/i.test(u);
 const rows=[https?['ok',L('HTTPS ব্যবহার হচ্ছে','Uses HTTPS')]:loc?['warn',L('লোকাল ডেভেলপমেন্ট ঠিকানা, শুধু এই ডিভাইসের জন্য','Local development address, this device only')]:['bad',L('সাধারণ HTTP অনুমোদিত নয়','Plain HTTP is not allowed')],priv?['bad',L('প্রাইভেট নেটওয়ার্কের ঠিকানা ব্লক','Private network addresses are blocked')]:valid?['ok',L('গন্তব্য বৈধ','Destination looks valid')]:['bad',L('URL সম্পূর্ণ নয়','URL is incomplete')],['ok',L('রিডাইরেক্ট সীমিত ও আবার যাচাই হবে','Redirects are limited and re-checked')]];
 return {ok:!rows.some(r=>r[0]==='bad'),rows};
}

/* ---------- render ---------- */
function render(){
 applyTheme();
 const a=document.getElementById('app');const f=document.activeElement;const fid=f&&f.id;const ss=f&&f.selectionStart;
 a.dataset.size=S.size;a.style.setProperty('--fs',S.fs);
 const hasPane=S.nav==='chat'||(S.nav==='settings'&&!compact());
 a.className='app'+(hasPane?'':' nopane');
 let main=S.nav==='home'?homeMain():S.nav==='chat'?chatMain():S.nav==='work'?workMain():settingsMain();
 a.innerHTML=navHTML()+paneHTML()+`<main class="main">${main}</main>`+((compact()&&S.drawer&&S.nav==='chat')?`<div class="scrim" data-act="closeall"></div>`:'')+sheetHTML()+(S.toast?`<div class="toast" role="status">${S.toast.m}${S.toast.undo?`<button data-act="undo">${L('ফিরিয়ে আনুন','Undo')}</button>`:''}</div>`:'');
 const ml=document.getElementById('msgs');if(ml)ml.scrollTop=ml.scrollHeight;
 const tm=document.getElementById('term');if(tm)tm.scrollTop=tm.scrollHeight;
 if(fid){const n=document.getElementById(fid);if(n&&!n.disabled){n.focus();try{n.setSelectionRange(ss,ss)}catch(e){}}}
 const ta=document.getElementById('inp');if(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,132)+'px'}
 toolbar();
}

const DEV={phone:[390,800,f=>f('ফোন','Phone')],tablet:[768,680,f=>f('ট্যাবলেট','Tablet')],laptop:[960,680,f=>f('ল্যাপটপ','Laptop')],desk:[1440,820,f=>f('ডেস্কটপ','Desktop')]};

 document.getElementById('devSeg').innerHTML=Object.entries(DEV).map(([k,v])=>`<button data-bar="dev" data-v="${k}" aria-pressed="${S.dev===k}">${v[2](L)} <span style="opacity:.7;font-size:12px">${v[0]}</span></button>`).join('');

 const ts=document.getElementById('themeSel');if(!ts.options.length)ts.innerHTML=Object.entries(PRE).map(([k,p])=>`<option value="${k}">${p.n}</option>`).join('');ts.value=S.theme;

}
function fit(){
 const [w,h]=DEV[S.dev];const st=document.getElementById('stage');const s=Math.min(1,(st.clientWidth-32)/w);
 const fr=document.getElementById('frame'),wr=document.getElementById('wrap');
 fr.style.width=w+'px';fr.style.height=h+'px';fr.style.transform=`scale(${s})`;wr.style.width=w*s+'px';wr.style.height=h*s+'px';
 const sz=w<600?'compact':w<840?'medium':w<1200?'expanded':'large';
 if(sz!==S.size){S.size=sz;S.drawer=false;if(sz!=='compact'&&S.ptab==='agent')S.ptab='editor';render()}
}
addEventListener('resize',fit);

/* ---------- behaviour ---------- */
function finishTool(id){
 const t=D.tools[id];t.s='ok';
 if(t.next){const n=D.tools[t.next];if(n.s==='todo'){n.s='run';render();setTimeout(()=>finishTool(t.next),1600)}}
 if(t.then){const c=convById(t.conv);c.msgs.push({r:'a',done:1,x:t.then})}
 render();
}
function startTool(id){const t=D.tools[id];t.s='run';render();setTimeout(()=>finishTool(id),1300)}
function newTool(c,o){const id='n'+(D.nid++);D.tools[id]=Object.assign({conv:c.id},o);return id}
function send(){
 const v=S.input.trim();if(!v)return;const c=target();
 if(c.t&&!c.msgs.length)c.t=v.slice(0,30);
 c.msgs.push({r:'u',x:v});S.input='';const m={r:'a',x:'',wait:1,tools:[]};c.msgs.push(m);render();
 setTimeout(()=>{
  m.wait=0;m.done=1;
  if(S.mode==='ask')m.x=L('এটি একটি নমুনা উত্তর। আসল মডেল যুক্ত নেই, তবে লেআউট ও অবস্থাগুলো এখানে দেখা যায়।','This is a sample reply. No real model is connected, but the layout and states are real.');
  else if(S.mode==='plan'){m.x=L('পরিকল্পনা তৈরি। কিছু বদলানো হয়নি।','Plan ready. Nothing was changed.');m.plan=[{bn:'প্রজেক্ট দেখা',en:'Inspect the project'},{bn:'ফাইল বদলের তালিকা',en:'List the files to change'},{bn:'বদল ও টেস্ট',en:'Make changes and test'}]}
  else if(S.mode==='review'){m.x=L('রিভিউ শেষ। তিনটি মন্তব্য:','Review done. Three comments:');m.find=[['ok',{bn:'নাম ও গঠন পরিষ্কার',en:'Naming and structure are clear'}],['warn',{bn:'একটি ফাংশন অনেক বড়, ভাগ করুন',en:'One function is long; split it'}],['warn',{bn:'ত্রুটির ক্ষেত্রে বার্তা নেই',en:'No message on the error path'}]]}
  else{m.x=L('আগে ফাইল পড়ছি, তারপর বদল করব।','Reading the files first, then making the change.');
   const a=newTool(c,{n:'read_file',a:'SettingsScreen.kt',s:'ok',d:'0.3s',o:'64 lines'});
   const b=newTool(c,{n:'edit_file',a:'SettingsScreen.kt',s:'wait',diff:['@@ SettingsScreen.kt','+ // updated by agent'],then:{bn:'বদল হয়ে গেছে।',en:'The change is in.'}});
   m.tools=[a,b]}
  render();},800);
}
let lastDel=null;
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='inp'){const had=!!S.input.trim();S.input=e.target.value;if(had!==!!S.input.trim())render();else{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,132)+'px'}}
 else if(id==='q'){S.q=e.target.value;render()}
 else if(id==='mcpurl'){S.url=e.target.value;render()}
 else if(id==='cmsg'){const had=!!S.commitMsg.trim();S.commitMsg=e.target.value;if(had!==!!S.commitMsg.trim())render()}
 else if(id==='termin')S.termIn=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.id==='themeSel'){S.theme=e.target.value;render()}});
document.addEventListener('keydown',e=>{
 if(e.target.id==='inp'&&e.key==='Enter'&&!e.shiftKey&&!compact()){e.preventDefault();send()}
 if(e.target.id==='termin'&&e.key==='Enter'){const c=S.termIn.trim();S.termIn='';D.term.push('$ '+c);
  if(c==='clear')D.term=[];else if(c==='help')D.term.push('help, ls, pwd, git status, clear');else if(c==='ls')D.term.push('composeApp  build.gradle.kts  README.md');else if(c==='pwd')D.term.push('/workspace/'+D.projects[S.proj].name);else if(c==='git status')D.term.push('M SettingsScreen.kt','?? ThemeToggle.kt');else if(c)D.term.push(L('প্রোটোটাইপে এই কমান্ড চলে না: ','Not run in the prototype: ')+c);
  render()}
 if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}
});
document.addEventListener('click',e=>{
 const bb=e.target.closest('[data-bar]');
 if(bb){const k=bb.dataset.bar,v=bb.dataset.v;if(k==='dev'){S.dev=v;S.drawer=false;fit();render()}if(k==='lang'){S.lang=v;render()}if(k==='style'){S.style=v;render()}return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 switch(a){
  case 'nav':S.nav=v;S.drawer=false;break;
  case 'profile':S.nav='settings';S.set='account';break;
  case 'drawer':S.drawer=!S.drawer;break;
  case 'closeall':S.drawer=false;break;
  case 'mode':S.mode=v;break;
  case 'newchat':case 'newchatx':{const id=D.nconv++;D.convs.unshift({id,g:'today',t:{bn:'নতুন চ্যাট',en:'New chat'},msgs:[]});S.conv=id;S.drawer=false;S.nav='chat';break}
  case 'conv':S.conv=+v;S.drawer=false;break;
  case 'openconv':S.conv=+v;S.nav='chat';break;
  case 'qs':S.input=b.dataset.t+': ';setTimeout(()=>{const t=document.getElementById('inp');t&&t.focus()},30);break;
  case 'send':send();return;
  case 'sheet':S.sheet=v;if(v==='addmcp')S.url='';break;
  case 'sheetx':S.sheet=null;break;
  case 'pickmodel':{const m=model(v);if(!m.key){S.sheet=null;S.nav='settings';S.set='providers';toast(L('আগে API কী যোগ করুন','Add an API key first'))}else{S.model=v;S.sheet=null}break}
  case 'tomodels':S.sheet=null;S.nav='settings';S.set='providers';break;
  case 'setmodel':{const m=model(v);if(m.key)S.model=v;else toast(L('প্রোটোটাইপে কী যোগ করা যায় না','Keys cannot be added in the prototype'));break}
  case 'tog':if(v in S.tog||v.startsWith('sk')){S.tog[v]=S.tog[v]===undefined?false:!S.tog[v]}else{S.open[v]=!(S.open[v]===undefined?(D.tools[v].s==='wait'||D.tools[v].s==='fail'||D.tools[v].s==='run'):S.open[v])}break;
  case 'allow':case 'allowses':S.open[v]=true;startTool(v);return;
  case 'deny':D.tools[v].s='fail';D.tools[v].sh=0;D.tools[v].diff=null;D.tools[v].o=L('আপনি এই ধাপ বাদ দিয়েছেন','You denied this step');D.tools[v].d='';toast(L('ধাপটি বাদ দেওয়া হয়েছে','Step denied'));break;
  case 'retry':{const t=D.tools[v];t.s='run';t.out=t.out||[];render();setTimeout(()=>{t.s='ok';t.code=0;t.d='5.2s';if(t.out.length)t.out=['> Task :composeApp:compileKotlin','> Task :composeApp:test','BUILD SUCCESSFUL in 5s'];finishTool(v)},1500);return}
  case 'fixit':S.mode='build';S.input=L('ত্রুটিটি ঠিক করো','Fix the error');setTimeout(()=>{const t=document.getElementById('inp');t&&t.focus()},30);break;
  case 'dynsel':{const m=convById(+b.dataset.c).msgs[+b.dataset.m];m.ui.sel=v;break}
  case 'dynok':{const c=convById(+b.dataset.c),m=c.msgs[+b.dataset.m];m.ui.done=true;const o=m.ui.opts.find(x=>x.id===m.ui.sel);c.msgs.push({r:'u',x:L('ব্যবহার করব: ','Use ')+o.n});c.msgs.push({r:'a',done:1,x:{bn:o.n+' বেছে নিয়েছেন। আমি সেটআপের ধাপগুলো সাজিয়ে দিচ্ছি। Build মোডে চালালে ফাইল তৈরি হবে।',en:'You chose '+o.n+'. I will line up the setup steps. Switch to Build mode to create the files.'}});break}
  case 'runplan':S.mode='build';S.input=L('পরিকল্পনা অনুযায়ী কাজটি করো','Carry out the plan');send();return;
  case 'regen':case 'copy':toast(L('প্রোটোটাইপে নিষ্ক্রিয়','Not active in the prototype'));break;
  case 'mic':toast(L('ভয়েস ইনপুট প্রোটোটাইপে নিষ্ক্রিয়','Voice input is off in the prototype'));break;
  case 'toast':toast(L('প্রোটোটাইপে নিষ্ক্রিয়','Not active in the prototype'));break;
  case 'setup':{S.setupRun=true;S.setupStep=0;render();const tick=()=>{S.setupStep++;if(S.setupStep>=3){S.setupRun=false;S.ws='ready';render();return}render();setTimeout(tick,900)};setTimeout(tick,900);return}
  case 'openproj':S.nav='work';if(S.ws==='setup')break;S.proj=+v;S.ptab=compact()?'agent':'editor';break;
  case 'goterm':S.nav='work';if(S.ws!=='setup'){S.proj=0;S.ptab='terminal'}break;
  case 'back':if(S.nav==='work')S.proj=null;break;
  case 'ptab':S.ptab=v;break;
  case 'file':S.file=+v;break;
  case 'openfile':{const i=Object.keys(CODE).indexOf(v);if(i>=0)S.file=i;S.sheet=null;S.ptab='editor';break}
  case 'gsel':S.gitSel=+v;break;
  case 'commit':D.git=[];D.log.unshift(['9d2e7ab',S.commitMsg.trim()]);S.commitMsg='';D.projects[0].ch=0;toast(L('কমিট হয়েছে','Committed'));break;
  case 'sandbox':S.sandbox=v==='1';toast(S.sandbox?L('Sandbox চালু হয়েছে','Sandbox started'):L('Sandbox বন্ধ হয়েছে','Sandbox stopped'));break;
  case 'resetws':S.ws='setup';S.setupStep=0;S.proj=null;S.nav='work';break;
  case 'set':S.set=v;break;
  case 'lang':S.lang=v;break;
  case 'fs':S.fs=+v;break;
  case 'style':S.style=v;break;
  case 'theme':S.theme=v;break;
  case 'defmode':S.defMode=v;S.mode=v;break;
  case 'policy':S.policy=v;break;
  case 'mcptest':{const m=D.mcp.find(x=>x.id===+v);m.ok=m.url.startsWith('https');toast(m.ok?L('সংযোগ ঠিক আছে','Connection works'):L('সংযোগ হয়নি। সার্ভার চালু আছে কিনা দেখুন।','Could not connect. Check the server is running.'));break}
  case 'addmcp':D.mcp.push({id:D.nid++,name:S.url.replace(/^https?:\/\//,'').split('/')[0],url:S.url.trim(),tools:0,ok:true});S.sheet=null;toast(L('সার্ভার যোগ হয়েছে','Server added'));break;
  case 'clearall':D.convs.length=0;D.convs.push({id:D.nconv++,g:'today',t:{bn:'নতুন চ্যাট',en:'New chat'},msgs:[]});S.conv=D.convs[0].id;S.sheet=null;toast(L('সব চ্যাট মুছে গেছে','All chats deleted'));break;
 }
 render();
});
