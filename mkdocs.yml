site_name: DORAI AI Documentation
site_url: https://habibbrox2.github.io/DoraiAi/docs/
site_description: Documentation for DORAI AI - Open-Source AI Assistant

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.tabs.link

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features:
    - Chat & Conversations: features/chat.md
    - Multi-Service: features/multi-service.md
    - Tools: features/tools.md
    - MCP Servers: features/mcp.md
    - Tasks: features/tasks.md
    - Daemon: features/daemon.md
    - Encryption: features/encryption.md
    - On-Device Inference: features/on-device-inference.md
    - Reasoning: features/reasoning.md
    - Linux Sandbox: features/sandbox.md
    - DORAI Build: features/dorai-build.md
    - Notifications: features/notifications.md
    - SMS: features/sms.md
    - Appearance: features/appearance.md
    - Settings Export & Import: features/settings-export-import.md
    - Splinterlands: features/splinterlands.md
  - Desktop Release Smoke Test: desktop-release-smoketest.md
