name: Auto Release

# DORAI automatic release pipeline.
# On every push to main:
#   1. Bump the next semantic version over the latest v*.*.* tag.
#   2. Build the Foss APK, Windows x64 MSI and Windows x64 zip from that tag.
#   3. Publish a GitHub Release named "DORAI v<version>"; DORAI is the fixed brand.
# The bump commit is pushed with GITHUB_TOKEN and does not retrigger workflows.
# Production APK releases require a configured production keystore.

# The bump commit is pushed with the workflow GITHUB_TOKEN, which does not
# retrigger workflows, so there is no release loop.
# Production APK releases require the configured production keystore. Missing or invalid signing secrets fail before version bump/tag creation.

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  signing-preflight:
    name: Validate production Android signing
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ENFORCE_RELEASE_SIGNING: "true"
    steps:
      - name: Validate signing secrets and keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEY_ALIAS KEYSTORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production signing secret ${name} is not configured."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/dorai-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Production signing keystore and alias validated."

  bump:
    name: Bump version and tag
    needs: signing-preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version, commit and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B release-bump origin/main

          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [[ -z "$LATEST" ]]; then
            echo "::error::No strict semantic-version tag exists; refusing to create a release."
            exit 1
          fi

          CURRENT_VERSION=$(sed -nE 's/^appVersion = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' gradle/libs.versions.toml)
          if [[ "$CURRENT_VERSION" != "${LATEST#v}" ]]; then
            echo "::error::Gradle appVersion ($CURRENT_VERSION) does not match latest release tag ($LATEST)."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          VERSION="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "::error::Tag v${VERSION} already exists; refusing to overwrite it."
            exit 1
          fi

          CODE=$(sed -nE 's/^android-versionCode = "([0-9]+)"/\1/p' gradle/libs.versions.toml)
          if [[ ! "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::android-versionCode is missing or invalid."
            exit 1
          fi
          NEW_CODE=$((10#$CODE + 1))

          sed -i "s/^appVersion = .*/appVersion = \"${VERSION}\"/" gradle/libs.versions.toml
          sed -i "s/^android-versionCode = .*/android-versionCode = \"${NEW_CODE}\"/" gradle/libs.versions.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"

          # Publish the version bump and immutable tag together. Never force-update a release tag.
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Prepared DORAI v${VERSION} (versionCode ${NEW_CODE})."

  apk:
    name: Build APK
    needs: bump
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ENFORCE_RELEASE_SIGNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android Build Tools
        run: |
          yes | sdkmanager "build-tools;37.0.0"
          yes | sdkmanager "build-tools;36.0.0"
          yes | sdkmanager "ndk;29.0.14206865"
      - name: Configure production signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/dorai-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build production-signed Foss APK
        run: ./gradlew :androidApp:assembleFossRelease --stacktrace
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          CERT_SHA256=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' "$RUNNER_TEMP/apk-signature.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          VERSION="${{ needs.bump.outputs.version }}"
          VERSION_CODE=$(grep -oP 'android-versionCode = "\K[0-9]+' gradle/libs.versions.toml)
          ASSET_NAME="DORAI-AI-v${VERSION}-Android.apk"
          python3 - "$VERSION" "$VERSION_CODE" "$ASSET_NAME" "$APK_SHA256" "$CERT_SHA256" <<'PY'
          import json, sys
          version, version_code, asset_name, sha256, cert_sha256 = sys.argv[1:]
          manifest = {
              "schemaVersion": 1,
              "packageName": "com.dorai.ai",
              "versionName": version,
              "versionCode": int(version_code),
              "assetName": asset_name,
              "downloadUrl": f"https://github.com/habibbrox2/DoraiAi/releases/download/v{version}/{asset_name}",
              "sha256": sha256,
              "signerCertificateSha256": cert_sha256,
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          test -s update.json
          python3 - "$VERSION" "$VERSION_CODE" "$ASSET_NAME" <<'PY'
          import json, re, sys
          version, version_code, asset_name = sys.argv[1:]
          with open("update.json", encoding="utf-8") as f:
              m = json.load(f)
          expected_url = f"https://github.com/habibbrox2/DoraiAi/releases/download/v{version}/{asset_name}"
          assert m.get("schemaVersion") == 1, "Invalid manifest schemaVersion"
          assert m.get("packageName") == "com.dorai.ai", "Invalid packageName"
          assert m.get("versionName") == version, "Manifest versionName mismatch"
          assert m.get("versionCode") == int(version_code) and int(version_code) > 0, "Invalid versionCode"
          assert m.get("assetName") == asset_name, "Manifest assetName mismatch"
          assert m.get("downloadUrl") == expected_url, "Manifest downloadUrl mismatch"
          assert re.fullmatch(r"[a-f0-9]{64}", m.get("sha256", "")), "Invalid APK SHA-256"
          assert re.fullmatch(r"[a-f0-9]{64}", m.get("signerCertificateSha256", "")), "Invalid signer SHA-256"
          PY
          cat update.json
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk
          if-no-files-found: error
      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: update.json
          if-no-files-found: error

  windows:
    name: Build MSI and Zip
    needs: bump
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress
      - name: Build MSI
        run: ./gradlew packageReleaseMsi --stacktrace
      - name: Build distributable
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Create zip
        run: |
          Compress-Archive -Path "composeApp/build/compose/binaries/main-release/app/DORAI/*" -DestinationPath "DORAI-AI-v${{ needs.bump.outputs.version }}-Windows-x64.zip"
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-package
          path: DORAI-AI-*-Windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [bump, apk, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Rename assets to DORAI branding
        run: |
          set -euo pipefail
          # "DORAI" is the fixed brand name; only the version changes per release
          VERSION="${{ needs.bump.outputs.version }}"
          cd dist
          if [ -f androidApp-foss-release.apk ]; then
            mv androidApp-foss-release.apk "DORAI-AI-v${VERSION}-Android.apk"
          else
            echo "::error::Expected signed APK artifact androidApp-foss-release.apk is missing."
            exit 1
          fi
          test -s update.json
          mv *.msi "DORAI-AI-v${VERSION}-Windows-x64.msi"
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DORAI v${{ needs.bump.outputs.version }}
          tag_name: v${{ needs.bump.outputs.version }}
          generate_release_notes: true
          files: |
            dist/DORAI-*
            dist/update.json

      - name: Publish canonical update.json to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API_PATH="repos/habibbrox2/DoraiAi/contents/update.json"
          VERSION="${{ needs.bump.outputs.version }}"
          MANIFEST="dist/update.json"
          APK="dist/DORAI-AI-v${VERSION}-Android.apk"
          test -s "$MANIFEST"
          test -s "$APK"

          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          ASSET_NAME="DORAI-AI-v${VERSION}-Android.apk"
          DOWNLOAD_URL="https://github.com/habibbrox2/DoraiAi/releases/download/v${VERSION}/${ASSET_NAME}"
          jq -e \
            --arg version "$VERSION" \
            --arg asset "$ASSET_NAME" \
            --arg url "$DOWNLOAD_URL" \
            --arg sha "$APK_SHA256" \
            '(.schemaVersion == 1) and
             (.packageName == "com.dorai.ai") and
             (.versionName == $version) and
             (.assetName == $asset) and
             (.downloadUrl == $url) and
             (.sha256 == $sha) and
             ((.versionCode | type) == "number") and (.versionCode > 0) and
             ((.signerCertificateSha256 | type) == "string") and
             (.signerCertificateSha256 | test("^[a-f0-9]{64}$"))' \
            "$MANIFEST" >/dev/null
          CANDIDATE_CODE=$(jq -er '.versionCode' "$MANIFEST")

          # A missing canonical file is an expected first-release state (HTTP 404).
          # Do not parse the 404 response body as if it were a Contents API file object.
          EXISTING_SHA=""
          if CURRENT=$(gh api "$API_PATH?ref=main" 2>/dev/null); then
            CURRENT_CONTENT=$(jq -r '.content // empty' <<<"$CURRENT" | tr -d '\r\n')
            if [[ -z "$CURRENT_CONTENT" ]]; then
              echo "::error::GitHub returned an existing update.json without file content."
              exit 1
            fi
            CURRENT_JSON=$(printf '%s' "$CURRENT_CONTENT" | base64 --decode)
            CURRENT_CODE=$(jq -er '.versionCode | select(type == "number")' <<<"$CURRENT_JSON")
            EXISTING_SHA=$(jq -er '.sha' <<<"$CURRENT")
            if (( CURRENT_CODE >= CANDIDATE_CODE )); then
              echo "Canonical manifest is already at versionCode ${CURRENT_CODE}; candidate ${CANDIDATE_CODE} is not newer."
              exit 0
            fi
          else
            echo "No canonical update.json exists on main yet; creating it."
          fi

          CONTENT=$(base64 -w 0 "$MANIFEST")
          PAYLOAD="$RUNNER_TEMP/update-manifest-payload.json"
          jq -n \
            --arg message "[skip ci] chore(update): publish v${VERSION} manifest" \
            --arg content "$CONTENT" \
            --arg branch "main" \
            --arg sha "$EXISTING_SHA" \
            '{message: $message, content: $content, branch: $branch} + (if $sha == "" then {} else {sha: $sha} end)' \
            > "$PAYLOAD"
          gh api --method PUT "$API_PATH" --input "$PAYLOAD" >/dev/null

          VERIFIED=$(gh api "$API_PATH?ref=main")
          VERIFIED_CONTENT=$(jq -r '.content // empty' <<<"$VERIFIED" | tr -d '\r\n')
          VERIFIED_JSON=$(printf '%s' "$VERIFIED_CONTENT" | base64 --decode)
          VERIFIED_CODE=$(jq -er '.versionCode | select(type == "number")' <<<"$VERIFIED_JSON")
          if [[ "$VERIFIED_CODE" != "$CANDIDATE_CODE" ]]; then
            echo "::error::Canonical manifest verification mismatch: expected ${CANDIDATE_CODE}, got ${VERIFIED_CODE}."
            exit 1
          fi
          echo "Published and verified canonical update.json for DORAI v${VERSION} (versionCode ${VERIFIED_CODE})."
