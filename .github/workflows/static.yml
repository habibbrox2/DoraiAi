name: Pages Build and Deployment

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site_build
          cp -R site/. _site_build/

      - name: Build documentation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check mkdocs-material
          python -m mkdocs build --strict --clean -d _site_build/docs

      - name: Validate project-site output
        run: |
          set -euo pipefail
          test -f _site_build/index.html
          test -f _site_build/404.html
          test -f _site_build/docs/index.html
          test -f _site_build/docs/sitemap.xml
          test ! -e _site_build/CNAME
          for file in _site_build/index.html _site_build/404.html _site_build/robots.txt _site_build/sitemap.xml _site_build/docs/index.html _site_build/run-gemma-locally/index.html _site_build/latex-math/index.html; do
            if grep -nF 'kai9000.com' "$file"; then
              echo "::error::Legacy Kai website hostname found in $file."
              exit 1
            fi
          done
          if grep -R -nE 'href="/(docs|run-gemma-locally|latex-math|app)/' _site_build --include='*.html'; then
            echo "::error::Root-relative links would break under the /DoraiAi/ project path."
            exit 1
          fi
          echo "Static DORAI AI Project Pages output validated. Web/Wasm app remains unpublished until ready."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site_build
          publish_branch: gh-pages
          enable_jekyll: false
