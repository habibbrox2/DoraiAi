name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Web Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting without modifying sources
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Validate committed WebP assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          unexpected=()
          for png in site/img/*.png; do
            name="${png##*/}"
            case "$name" in
              og-preview.png|preview.png) ;;
              *) unexpected+=("$png") ;;
            esac
          done
          if (("${#unexpected[@]}" > 0)); then
            printf 'Unconverted site image(s) found:\\n'
            printf ' - %s\\n' "${unexpected[@]}"
            echo "Run the WebP conversion maintenance script locally and review the resulting asset changes."
            exit 1
          fi
          echo "Site image format validation passed."

  desktop:
    name: Desktop Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run desktop and shared tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

  android:
    name: Android FOSS Compile and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Run Android FOSS compile and unit tests
        run: ./gradlew :androidApp:compileFossDebugKotlin :androidApp:testFossDebugUnitTest --no-daemon --stacktrace

  screenshots:
    name: Screenshot Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # One-time bootstrap: record the missing legacy suites plus newly added Premium tool-state goldens.
      # Existing Dashboard and Build Premium goldens are preserved by selecting only the three new tests.
      - name: Record missing Paparazzi baselines
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('screenshotTests/RECORD_GOLDENS') != ''
        run: >-
          ./gradlew :screenshotTests:recordPaparazziDebug
          --tests com.inspiredandroid.kai.screenshots.GemmaLocalScreenshotTest
          --tests com.inspiredandroid.kai.screenshots.MathScreenshotTest
          --tests com.inspiredandroid.kai.screenshots.KaiUiScreenshotTest
          --tests com.inspiredandroid.kai.screenshots.ScreenshotTest
          --tests com.inspiredandroid.kai.screenshots.PremiumScreenScreenshotTest.toolExecution_running_dark
          --tests com.inspiredandroid.kai.screenshots.PremiumScreenScreenshotTest.toolExecution_failed_dark
          --tests com.inspiredandroid.kai.screenshots.PremiumScreenScreenshotTest.toolConfirmation_pending_dark
          --tests com.inspiredandroid.kai.screenshots.PremiumScreenScreenshotTest.dashboard_overview_dark
          --tests com.inspiredandroid.kai.screenshots.PremiumScreenScreenshotTest.Workspace_setup_dark
          --tests com.inspiredandroid.kai.screenshots.TabletStoreScreenshotTest
          --no-daemon --stacktrace

      # Commit the complete baseline set before verification. This bootstrap marker
      # is removed in the same commit, so future runs verify without silently recording goldens.
      # GITHUB_TOKEN-authored pushes do not recursively trigger another workflow run.
      - name: Commit bootstrapped Paparazzi goldens
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('screenshotTests/RECORD_GOLDENS') != ''
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir="screenshotTests/src/test/snapshots/images"
          mapfile -t goldens < <(find "$snapshot_dir" -maxdepth 1 -type f -name '*.png' -print | sort)
          if [[ "${#goldens[@]}" -ne 77 ]]; then
            echo "::error::Expected 77 Paparazzi golden PNGs after bootstrap; found ${#goldens[@]}."
            printf '%s\\n' "${goldens[@]}"
            exit 1
          fi

          assert_count() {
            local pattern="$1"
            local expected="$2"
            local count
            count=$(find "$snapshot_dir" -maxdepth 1 -type f -name "$pattern" | wc -l)
            if [[ "$count" -ne "$expected" ]]; then
              echo "::error::Expected $expected files matching $pattern; found $count."
              exit 1
            fi
          }
          assert_count '*GemmaLocalScreenshotTest_*.png' 7
          assert_count '*MathScreenshotTest_*.png' 5
          assert_count '*KaiUiScreenshotTest_*.png' 23
          assert_count 'com.inspiredandroid.kai.screenshots_ScreenshotTest_*.png' 36
          assert_count '*PremiumScreenScreenshotTest_*.png' 5
          assert_count '*TabletStoreScreenshotTest_*.png' 1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "${goldens[@]}"
          rm screenshotTests/RECORD_GOLDENS
          git add -u -- screenshotTests/RECORD_GOLDENS
          git diff --cached --check
          git commit -m "test(ui): bootstrap complete Paparazzi golden baseline [skip ci]"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Verify Paparazzi golden files
        run: ./gradlew :screenshotTests:verifyPaparazziDebug --no-daemon --stacktrace

      # Paparazzi writes expected/actual/delta PNGs here when comparisons fail.
      # Keep this upload unconditional so visual evidence survives a failed verify task.
      - name: Upload screenshot regression reports and visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-regression-evidence-${{ github.run_id }}
          path: |
            screenshotTests/build/test-results/testDebugUnitTest/
            screenshotTests/build/reports/tests/testDebugUnitTest/
            screenshotTests/build/paparazzi/failures/debug/
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required check name while exposing parallel job results.
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality
      - desktop
      - android
      - screenshots
    steps:
      - name: Require every validation job to pass
        shell: bash
        run: |
          results=("${{ needs.quality.result }}" "${{ needs.desktop.result }}" "${{ needs.android.result }}" "${{ needs.screenshots.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required validation job did not succeed: $result"
              exit 1
            fi
          done
          echo "All validation jobs passed."
