name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Web Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting without modifying sources
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Validate committed WebP assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          unexpected=()
          for png in site/img/*.png; do
            name="${png##*/}"
            case "$name" in
              og-preview.png|preview.png) ;;
              *) unexpected+=("$png") ;;
            esac
          done
          if (("${#unexpected[@]}" > 0)); then
            printf 'Unconverted site image(s) found:\n'
            printf ' - %s\n' "${unexpected[@]}"
            echo "Run the WebP conversion maintenance script locally and review the resulting asset changes."
            exit 1
          fi
          echo "Site image format validation passed."

  desktop:
    name: Desktop Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run desktop and shared tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

  android:
    name: Android FOSS Compile and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Run Android FOSS compile and unit tests
        run: ./gradlew :androidApp:compileFossDebugKotlin :androidApp:testFossDebugUnitTest --no-daemon --stacktrace

  screenshots:
    name: Screenshot Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Golden recording is opt-in via the one-time marker committed with a UI test change.
      # Limit recording to the new screen class; all screenshot suites are then verified.
      - name: Record requested Premium UI goldens
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('screenshotTests/RECORD_GOLDENS') != ''
        run: >-
          ./gradlew :screenshotTests:recordPaparazziDebug
          --tests com.inspiredandroid.kai.screenshots.PremiumScreenScreenshotTest
          --no-daemon --stacktrace

      # Commit the two explicitly requested goldens immediately after recording.
      # Do this before verification so a later baseline mismatch cannot discard the new files.
      # GITHUB_TOKEN-authored pushes do not recursively trigger another workflow run.
      - name: Commit generated Premium UI goldens
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('screenshotTests/RECORD_GOLDENS') != ''
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t goldens < <(
            find screenshotTests/src/test/snapshots/images -maxdepth 1 -type f -name '*PremiumScreenScreenshotTest_*.png' -print | sort
          )
          if [[ "${#goldens[@]}" -ne 2 ]]; then
            echo "::error::Expected exactly two PremiumScreenScreenshotTest golden PNGs; found ${#goldens[@]}."
            printf '%s\\n' "${goldens[@]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "${goldens[@]}"
          rm screenshotTests/RECORD_GOLDENS
          git add -u -- screenshotTests/RECORD_GOLDENS
          git diff --cached --check
          git commit -m "test(ui): record Dashboard and Kai Build Paparazzi goldens [skip ci]"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Verify Paparazzi golden files
        run: ./gradlew :screenshotTests:verifyPaparazziDebug --no-daemon --stacktrace

      - name: Upload screenshot regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-regression-reports-${{ github.run_id }}
          path: |
            screenshotTests/build/test-results/testDebugUnitTest/
            screenshotTests/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required check name while exposing parallel job results.
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality
      - desktop
      - android
      - screenshots
    steps:
      - name: Require every validation job to pass
        shell: bash
        run: |
          results=("${{ needs.quality.result }}" "${{ needs.desktop.result }}" "${{ needs.android.result }}" "${{ needs.screenshots.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required validation job did not succeed: $result"
              exit 1
            fi
          done
          echo "All validation jobs passed."
