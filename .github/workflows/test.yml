name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_quality: ${{ steps.filter.outputs.run_quality }}
      run_desktop: ${{ steps.filter.outputs.run_desktop }}
      run_android: ${{ steps.filter.outputs.run_android }}
      run_screenshots: ${{ steps.filter.outputs.run_screenshots }}
      run_agent_tooling: ${{ steps.filter.outputs.run_agent_tooling }}
      run_frontend: ${{ steps.filter.outputs.run_frontend }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          quality=false; desktop=false; android=false; screenshots=false; agent_tooling=false; frontend=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            quality=true; desktop=true; android=true; screenshots=true; agent_tooling=true; frontend=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$BASE_SHA"; else base="$BEFORE_SHA"; fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              quality=true; desktop=true; android=true; screenshots=true; agent_tooling=true; frontend=true
            else
              git diff --check "$base" "$HEAD_SHA"
              while IFS= read -r file; do
                [[ -z "$file" ]] && continue
                case "$file" in
                  gradle/*|gradlew|gradlew.bat|settings.gradle.kts|build.gradle.kts|*/build.gradle.kts|gradle.properties|hybrid/contracts/*|*/sqldelight/*)
                    quality=true; desktop=true; android=true; screenshots=true ;;
                  .github/workflows/*)
                    quality=true; desktop=true; android=true; screenshots=true; frontend=true ;;
                  *.kt|*.kts) quality=true ;;
                esac
                case "$file" in
                  composeApp/src/commonMain/*|composeApp/src/commonTest/*|composeApp/src/desktopMain/*|composeApp/src/jvmShared/*|composeApp/src/desktopTest/*)
                    desktop=true ;;
                esac
                case "$file" in
                  composeApp/src/commonMain/*|composeApp/src/androidMain/*|androidApp/*|composeApp/src/jvmShared/*)
                    android=true ;;
                esac
                case "$file" in
                  composeApp/src/commonMain/*/ui/*|composeApp/src/commonMain/*/theme/*|composeApp/src/commonMain/composeResources/*|screenshotTests/*)
                    screenshots=true ;;
                esac
                case "$file" in
                  frontend/*|hybrid/contracts/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                    frontend=true ;;
                esac
                case "$file" in
                  site/img/*|scripts/*webp*|scripts/*Webp*) quality=true ;;
                esac
                case "$file" in
                  AGENTS.md|CLAUDE.md|.gitattributes|agents/*|skills/*|scripts/*|.agents/*|.claude/*|.cursor/*|.windsurf/*|.kilocode/*|.opencode/*|.github/copilot-instructions.md|.github/instructions/*|.vscode/*|.gitignore)
                    agent_tooling=true ;;
                esac
              done < <(git diff --name-only "$base" "$HEAD_SHA")
            fi
          fi
          echo "run_quality=$quality" >> "$GITHUB_OUTPUT"
          echo "run_desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "run_android=$android" >> "$GITHUB_OUTPUT"
          echo "run_screenshots=$screenshots" >> "$GITHUB_OUTPUT"
          echo "run_agent_tooling=$agent_tooling" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$frontend" >> "$GITHUB_OUTPUT"
          printf 'Selected jobs: quality=%s desktop=%s android=%s screenshots=%s agent_tooling=%s frontend=%s\n' "$quality" "$desktop" "$android" "$screenshots" "$agent_tooling" "$frontend"

  agent_tooling:
    name: Agent Tooling Checks
    needs: changes
    if: needs.changes.outputs.run_agent_tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate agent scripts and native configuration
        shell: pwsh
        run: ./scripts/test-agent-tooling.ps1

  frontend:
    name: Frontend Checks
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend type, contract, unit, and format checks
        run: pnpm frontend:check

  quality:
    name: Quality and Web Assets
    needs: changes
    if: needs.changes.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check formatting without modifying sources
        run: ./gradlew spotlessCheck --no-daemon --stacktrace
      - name: Validate committed WebP assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          unexpected=()
          for png in site/img/*.png; do
            name="${png##*/}"
            case "$name" in apple-icon-180x180.png|og-preview.png|preview.png) ;; *) unexpected+=("$png") ;; esac
          done
          if (("${#unexpected[@]}" > 0)); then
            printf 'Unconverted site image(s) found:\n'
            printf ' - %s\n' "${unexpected[@]}"
            echo "Run the WebP conversion maintenance script locally and review the resulting asset changes."
            exit 1
          fi
          echo "Site image format validation passed."

  desktop:
    name: Desktop Tests
    needs: changes
    if: needs.changes.outputs.run_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run desktop and shared tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

  android:
    name: Android FOSS Compile and Unit Tests
    needs: changes
    if: needs.changes.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Run Android FOSS compile and unit tests
        run: ./gradlew :androidApp:compileFossDebugKotlin :androidApp:testFossDebugUnitTest --no-daemon --stacktrace

  screenshots:
    name: Screenshot Regression
    needs: changes
    if: needs.changes.outputs.run_screenshots == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      # One-time bootstrap is restricted to same-repository PRs and never writes back to Git.
      - name: Record missing Paparazzi baselines
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('screenshotTests/RECORD_GOLDENS') != ''
        run: >-
          ./gradlew :screenshotTests:recordPaparazziDebug
          --tests com.dorai.ai.screenshots.GemmaLocalScreenshotTest
          --tests com.dorai.ai.screenshots.MathScreenshotTest
          --tests com.dorai.ai.screenshots.DoraiUiScreenshotTest
          --tests com.dorai.ai.screenshots.ScreenshotTest
          --tests com.dorai.ai.screenshots.PremiumScreenScreenshotTest.toolExecution_running_dark
          --tests com.dorai.ai.screenshots.PremiumScreenScreenshotTest.toolExecution_failed_dark
          --tests com.dorai.ai.screenshots.PremiumScreenScreenshotTest.toolConfirmation_pending_dark
          --tests com.dorai.ai.screenshots.PremiumScreenScreenshotTest.dashboard_overview_dark
          --tests com.dorai.ai.screenshots.PremiumScreenScreenshotTest.Workspace_setup_dark
          --tests com.dorai.ai.screenshots.TabletStoreScreenshotTest
          --no-parallel --max-workers=1 --no-daemon --stacktrace

      - name: Verify Paparazzi golden files
        if: hashFiles('screenshotTests/RECORD_GOLDENS') == ''
        run: ./gradlew :screenshotTests:verifyPaparazziDebug --no-parallel --max-workers=1 --no-daemon --stacktrace
      - name: Upload screenshot regression reports and visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-regression-evidence-${{ github.run_id }}
          path: |
            screenshotTests/build/test-results/testDebugUnitTest/
            screenshotTests/build/reports/tests/testDebugUnitTest/
            screenshotTests/build/paparazzi/failures/debug/
            screenshotTests/src/test/snapshots/images/
          if-no-files-found: warn
          retention-days: 14

  # Keep the stable required check. Skipped jobs are accepted only when the classifier excludes them.
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - agent_tooling
      - frontend
      - quality
      - desktop
      - android
      - screenshots
    steps:
      - name: Require every selected validation job to pass
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AGENT_TOOLING_RESULT: ${{ needs.agent_tooling.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          SCREENSHOTS_RESULT: ${{ needs.screenshots.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]] || { echo "Change classification failed: $CHANGES_RESULT"; exit 1; }
          for result in "$AGENT_TOOLING_RESULT" "$FRONTEND_RESULT" "$QUALITY_RESULT" "$DESKTOP_RESULT" "$ANDROID_RESULT" "$SCREENSHOTS_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A selected validation job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All selected validation jobs passed; non-applicable jobs were skipped."
