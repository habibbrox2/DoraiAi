name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Web Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting without modifying sources
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Validate committed WebP assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          unexpected=()
          for png in site/img/*.png; do
            name="${png##*/}"
            case "$name" in
              og-preview.png|preview.png) ;;
              *) unexpected+=("$png") ;;
            esac
          done
          if (("${#unexpected[@]}" > 0)); then
            printf 'Unconverted site image(s) found:\n'
            printf ' - %s\n' "${unexpected[@]}"
            echo "Run the WebP conversion maintenance script locally and review the resulting asset changes."
            exit 1
          fi
          echo "Site image format validation passed."

  desktop:
    name: Desktop Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run desktop and shared tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

  android:
    name: Android FOSS Compile and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Run Android FOSS compile and unit tests
        run: ./gradlew :androidApp:compileFossDebugKotlin :androidApp:testFossDebugUnitTest --no-daemon --stacktrace

  screenshots:
    name: Screenshot Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # This executes Paparazzi tests against committed golden files.
      # It deliberately does not run recordPaparazziDebug/updateScreenshots.
      - name: Verify screenshot golden files
        run: ./gradlew :screenshotTests:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload screenshot regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-regression-reports-${{ github.run_id }}
          path: |
            screenshotTests/build/test-results/testDebugUnitTest/
            screenshotTests/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required check name while exposing parallel job results.
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality
      - desktop
      - android
      - screenshots
    steps:
      - name: Require every validation job to pass
        shell: bash
        run: |
          results=("${{ needs.quality.result }}" "${{ needs.desktop.result }}" "${{ needs.android.result }}" "${{ needs.screenshots.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required validation job did not succeed: $result"
              exit 1
            fi
          done
          echo "All validation jobs passed."
