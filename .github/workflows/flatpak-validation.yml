name: Flatpak Build Validation

on:
  push:
    branches: [fix/flatpak-icon-512px]
    paths:
      - ".github/workflows/flatpak-validation.yml"
      - "flatpak/**"
      - "composeApp/icon.svg"
      - "composeApp/build.gradle.kts"
      - "gradle/**"
      - "gradlew"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flatpak-validation.yml"
      - "flatpak/**"
      - "composeApp/icon.svg"
      - "composeApp/build.gradle.kts"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flatpak-build:
    name: Build Linux Flatpak (validation only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Linux application distribution
        run: ./gradlew createReleaseDistributable --stacktrace

      - name: Create Linux tarball
        shell: bash
        run: |
          set -euo pipefail
          DIST="composeApp/build/compose/binaries/main-release/app/DORAI"
          test -d "$DIST"
          tar czf "$GITHUB_WORKSPACE/DORAI-AI-linux-x86_64.tar.gz" -C "$(dirname "$DIST")" DORAI
          test -s "$GITHUB_WORKSPACE/DORAI-AI-linux-x86_64.tar.gz"

      - name: Install Flatpak tooling and runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder file
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Prepare validation manifest
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/DORAI-AI-linux-x86_64.tar.gz" flatpak/
          cp flatpak/com.dorai.ai.yaml flatpak/com.dorai.ai.validation.yaml
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("flatpak/com.dorai.ai.validation.yaml")
          text = manifest.read_text(encoding="utf-8")
          source_url = "https://github.com/habibbrox2/DoraiAi/releases/download/v2.1.4/DORAI-AI-v2.1.4-linux-x86_64.tar.gz"
          source_sha = "aaf111532900f674a75c963721d027179d07faace520e6a02a23c33ead2d7330"
          source = f"url: {source_url}\n        sha256: {source_sha}\n        dest-filename: DORAI-AI-linux-x86_64.tar.gz"
          replacement = "path: DORAI-AI-linux-x86_64.tar.gz\n        dest-filename: DORAI-AI-linux-x86_64.tar.gz"
          if source not in text:
              raise SystemExit("Expected release tarball source was not found in Flatpak manifest")
          text = text.replace(source, replacement, 1)
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Build Flatpak package
        working-directory: flatpak
        run: |
          set -euo pipefail
          flatpak-builder --repo=repo --force-clean build-dir com.dorai.ai.validation.yaml
          flatpak build-bundle repo "$GITHUB_WORKSPACE/DORAI-AI-validation.flatpak" com.dorai.ai
          test -s "$GITHUB_WORKSPACE/DORAI-AI-validation.flatpak"

      - name: Verify package output
        run: |
          set -euo pipefail
          file DORAI-AI-validation.flatpak
          sha256sum DORAI-AI-validation.flatpak
