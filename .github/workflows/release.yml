name: DORAI Production Release

# Canonical production release workflow.
#
# The ONLY trigger is `workflow_dispatch` (manual run from the GitHub Actions tab).
# A normal push or merge to main must NEVER create a version bump, Git tag,
# or production GitHub Release.
#
# Required input:
#   release_type: patch | minor | major  (default: patch)
#
# The workflow refuses to run unless the selected branch is "main".
#
# Architecture:
#   Phase A: Preflight Validation (Branch, secrets, release target version)
#   Phase B: Build Required Targets (Android APK, Windows MSI & ZIP) & Optional Targets (macOS, Linux)
#   Phase C: Post-Build Tagging & Release (Tag created ONLY if required builds succeed, then published)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Semantic release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REPO_OWNER: habibbrox2
  REPO_NAME: DoraiAi
  KEYSTORE_PATH: ${{ github.workspace }}/dorai-release.jks

jobs:
  ###############################################################################
  # Phase A — Preflight Validation
  ###############################################################################
  preflight:
    name: Preflight validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      versionCode: ${{ steps.bump.outputs.versionCode }}
    steps:
      - name: Validate workflow_dispatch event
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "::error::This workflow can only be triggered manually via workflow_dispatch."
            exit 1
          fi

      - name: Validate main branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Production releases can only be created from the main branch. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate source commit is origin/main HEAD
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/main)
          if [[ "$LOCAL" != "$REMOTE" ]]; then
            echo "::error::Working source commit ($LOCAL) is not origin/main HEAD ($REMOTE)."
            exit 1
          fi
          echo "Source commit is origin/main HEAD."

      - name: Validate latest strict semantic-version Git tag
        id: latest-tag
        run: |
          set -euo pipefail
          git fetch origin --tags
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [[ -z "$LATEST" ]]; then
            echo "::error::No strict semantic-version tag (vMAJOR.MINOR.PATCH) exists; refusing to create a release."
            exit 1
          fi
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: ${LATEST}"

      - name: Validate Android versionCode
        run: |
          set -euo pipefail
          CODE=$(sed -nE 's/^android-versionCode = "([0-9]+)"/\1/p' gradle/libs.versions.toml)
          if [[ -z "$CODE" || ! "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::android-versionCode is missing or invalid in gradle/libs.versions.toml."
            exit 1
          fi
          echo "android-versionCode: ${CODE}"

      - name: Validate production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEY_ALIAS KEYSTORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production signing secret ${name} is not configured."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Production signing keystore and alias validated."

      - name: Confirm target version and bump version metadata
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST="${{ steps.latest-tag.outputs.latest }}"
          TAG_VERSION="${LATEST#v}"
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          case "$RELEASE_TYPE" in
            patch) TARGET_VERSION="${MAJOR}.${MINOR}.$((10#$PATCH + 1))" ;;
            minor) TARGET_VERSION="${MAJOR}.$((10#$MINOR + 1)).0" ;;
            major) TARGET_VERSION="$((10#$MAJOR + 1)).0.0" ;;
            *) echo "::error::Invalid release_type: ${RELEASE_TYPE}"; exit 1 ;;
          esac

          APP_VERSION=$(sed -nE 's/^appVersion = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' gradle/libs.versions.toml)
          CODE=$(sed -nE 's/^android-versionCode = "([0-9]+)"/\1/p' gradle/libs.versions.toml)
          if [[ -z "$CODE" || ! "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::android-versionCode is missing or invalid in gradle/libs.versions.toml."
            exit 1
          fi

          if [[ "$APP_VERSION" == "$TARGET_VERSION" ]]; then
            # Version metadata was already PR-merged to the release target; use it as-is.
            FINAL_CODE="$CODE"
            echo "Version metadata already at v${TARGET_VERSION} (code ${FINAL_CODE}); no bump required."
          else
            # Automatic bump: appVersion -> TARGET_VERSION, android-versionCode -> +1.
            FINAL_CODE=$((10#$CODE + 1))
            sed -i "s/^appVersion = .*/appVersion = \"${TARGET_VERSION}\"/" gradle/libs.versions.toml
            sed -i "s/^android-versionCode = .*/android-versionCode = \"${FINAL_CODE}\"/" gradle/libs.versions.toml

            # Main is protected: publish the bump via PR + auto-merge, then wait for the
            # merge so downstream build jobs (fresh checkout of main) read the bumped values.
            BRANCH="chore/release-metadata-v${TARGET_VERSION}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git checkout -B "$BRANCH" origin/main
            git add gradle/libs.versions.toml
            git commit -m "[skip ci] chore(release): bump version metadata to v${TARGET_VERSION} (code ${FINAL_CODE})"
            git push origin "HEAD:refs/heads/${BRANCH}" --force
            PR_URL=$(gh pr create \
              --repo "${REPO_OWNER}/${REPO_NAME}" \
              --base main --head "$BRANCH" \
              --title "chore(release): bump version metadata to v${TARGET_VERSION}" \
              --body "Auto-bump appVersion and android-versionCode for DORAI v${TARGET_VERSION}. Created by the release workflow.")
            for i in $(seq 1 12); do
              if gh pr merge "$BRANCH" --repo "${REPO_OWNER}/${REPO_NAME}" --merge 2>/dev/null; then
                echo "Version-metadata PR merged."
                break
              fi
              if [[ $i -eq 12 ]]; then
                echo "::error::Version-metadata PR was not auto-mergeable; merge ${PR_URL} manually and re-run the release."
                exit 1
              fi
              sleep 5
            done
          fi

          # Confirm the merged metadata on origin/main before builds consume it.
          git fetch origin main
          MERGED_VERSION=$(git show origin/main:gradle/libs.versions.toml | sed -nE 's/^appVersion = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p')
          MERGED_CODE=$(git show origin/main:gradle/libs.versions.toml | sed -nE 's/^android-versionCode = "([0-9]+)"/\1/p')
          if [[ "$MERGED_VERSION" != "$TARGET_VERSION" || "$MERGED_CODE" != "$FINAL_CODE" ]]; then
            echo "::error::Merged metadata (v${MERGED_VERSION}/code ${MERGED_CODE}) does not match target (v${TARGET_VERSION}/code ${FINAL_CODE})."
            exit 1
          fi

          echo "version=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${FINAL_CODE}" >> "$GITHUB_OUTPUT"
          echo "Release target validated: v${TARGET_VERSION} (versionCode ${FINAL_CODE})."

  ###############################################################################
  # Phase B — Build Targets (APK & MSI required; Others optional)
  ###############################################################################
  apk:
    name: Build signed Android FOSS APK (Required)
    needs: preflight
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ENFORCE_RELEASE_SIGNING: "true"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools and NDK
        run: |
          yes | sdkmanager "build-tools;37.0.0"
          yes | sdkmanager "build-tools;36.0.0"
          yes | sdkmanager "ndk;29.0.14206865"

      - name: Configure production signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build production-signed Foss APK
        run: ./gradlew :androidApp:assembleFossRelease --stacktrace

      - name: Verify APK signature and extract digests
        id: apk-digest
        shell: bash
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "${{ runner.temp }}/apk-signature.txt"
          CERT_SHA256=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' "${{ runner.temp }}/apk-signature.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          VERSION="${{ needs.preflight.outputs.version }}"
          VERSION_CODE=$(grep -oP 'android-versionCode = "\K[0-9]+' gradle/libs.versions.toml)
          ASSET_NAME="DORAI-AI-v${VERSION}-Android.apk"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "APK verified: ${ASSET_NAME} (SHA-256: ${APK_SHA256})"

      - name: Generate update.json
        shell: bash
        run: |
          python3 - "${{ needs.preflight.outputs.version }}" "${{ steps.apk-digest.outputs.version_code }}" "${{ steps.apk-digest.outputs.asset_name }}" "${{ steps.apk-digest.outputs.apk_sha256 }}" "${{ steps.apk-digest.outputs.cert_sha256 }}" <<'PY'
          import json, os, sys
          version, version_code, asset_name, sha256, cert_sha256 = sys.argv[1:]
          manifest = {
              "schemaVersion": 1,
              "packageName": "com.dorai.ai",
              "versionName": version,
              "versionCode": int(version_code),
              "assetName": asset_name,
              "downloadUrl": f"https://github.com/{os.environ['REPO_OWNER']}/{os.environ['REPO_NAME']}/releases/download/v{version}/{asset_name}",
              "sha256": sha256,
              "signerCertificateSha256": cert_sha256,
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          test -s update.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk
          if-no-files-found: error

      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: update.json
          if-no-files-found: error

  android-standard:
    name: Build signed Android Standard APK (Optional)
    needs: preflight
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ENFORCE_RELEASE_SIGNING: "true"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools and NDK
        run: |
          yes | sdkmanager "build-tools;37.0.0"
          yes | sdkmanager "build-tools;36.0.0"
          yes | sdkmanager "ndk;29.0.14206865"

      - name: Configure production signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build production-signed PlayStore APK
        run: ./gradlew :androidApp:assemblePlayStoreRelease --stacktrace

      - name: Upload Standard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-standard-package
          path: androidApp/build/outputs/apk/playStore/release/androidApp-playStore-release.apk
          if-no-files-found: warn

  windows:
    name: Build Windows MSI and ZIP (Required)
    needs: preflight
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build MSI
        run: .\gradlew.bat packageReleaseMsi --stacktrace

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

      - name: Build portable distribution
        run: .\gradlew.bat createReleaseDistributable --stacktrace

      - name: Create ZIP of portable distribution
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          $sourceDir = "composeApp/build/compose/binaries/main-release/app/DORAI"
          $zipName = "DORAI-AI-v${version}-Windows-x64.zip"
          Compress-Archive -Path "$sourceDir\*" -DestinationPath $zipName
          Write-Host "Created portable archive: $zipName"

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-package
          path: DORAI-AI-*-Windows-x64.zip
          if-no-files-found: error

  macos:
    name: Build macOS DMG (Optional)
    needs: preflight
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Build DMG
        run: ./gradlew packageReleaseDmg --stacktrace

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-package
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: warn

  linux-deb:
    name: Build Linux DEB (Optional)
    needs: preflight
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Build DEB
        run: ./gradlew packageReleaseDeb --stacktrace

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: composeApp/build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: warn

  linux-rpm:
    name: Build Linux RPM (Optional)
    needs: preflight
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build RPM
        run: ./gradlew packageReleaseRpm --stacktrace

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: composeApp/build/compose/binaries/main-release/rpm/*.rpm
          if-no-files-found: warn

  linux-tarball:
    name: Build Linux x86_64 tarball (Optional)
    needs: preflight
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace

      - name: Package Linux tarball
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          DIST_DIR="composeApp/build/compose/binaries/main-release/app/DORAI"
          test -d "$DIST_DIR"
          tar -czvf "DORAI-AI-linux-x86_64.tar.gz" -C "$DIST_DIR" .
          ls -lh "DORAI-AI-linux-x86_64.tar.gz"

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball-package
          path: DORAI-AI-linux-x86_64.tar.gz
          if-no-files-found: warn

  flatpak:
    name: Build Linux Flatpak (Optional)
    needs: preflight
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace

      - name: Package Linux tarball
        run: |
          DIST_DIR="composeApp/build/compose/binaries/main-release/app/DORAI"
          test -d "$DIST_DIR"
          tar -czvf "DORAI-AI-linux-x86_64.tar.gz" -C "$DIST_DIR" .

      - name: Install Flatpak and Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          cp DORAI-AI-linux-x86_64.tar.gz flatpak/
          SHA256=$(sha256sum DORAI-AI-linux-x86_64.tar.gz | cut -d' ' -f1)
          cd flatpak
          sed -i "s|url: .*|path: DORAI-AI-linux-x86_64.tar.gz|" com.dorai.ai.yaml
          sed -i "s|sha256: .*|sha256: ${SHA256}|" com.dorai.ai.yaml
          flatpak-builder --repo=repo --force-clean build-dir com.dorai.ai.yaml
          flatpak build-bundle repo ../DORAI-AI.flatpak com.dorai.ai

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: DORAI-AI.flatpak
          if-no-files-found: warn

  appimage:
    name: Build Linux AppImage (Optional)
    needs: preflight
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace

      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppDir structure
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r composeApp/build/compose/binaries/main-release/app/DORAI/* AppDir/usr/lib/

          cp composeApp/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/dorai.png
          cp composeApp/icon.png AppDir/dorai.png

          cat > AppDir/dorai.desktop << 'EOF'
          [Desktop Entry]
          Name=DORAI AI
          Comment=AI Assistant Application
          Exec=dorai
          Icon=dorai
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          cp AppDir/dorai.desktop AppDir/usr/share/applications/

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/lib/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/lib/runtime/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/lib/bin/DORAI" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir DORAI-AI-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: DORAI-AI-*.AppImage
          if-no-files-found: warn

  ###############################################################################
  # Phase C — Post-Build Tagging & GitHub Release Publication
  ###############################################################################
  release:
    name: Tag and Publish GitHub Release
    needs: [preflight, apk, android-standard, windows, macos, linux-deb, linux-rpm, linux-tarball, flatpak, appimage]
    if: always() && needs.preflight.result == 'success' && needs.apk.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push immutable release tag post-build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          git fetch origin main --tags
          if ! git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            git tag "v${VERSION}" origin/main
            git push origin "refs/tags/v${VERSION}"
            echo "Successfully created and pushed tag v${VERSION} after required builds passed."
          else
            echo "Tag v${VERSION} already exists on origin."
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify required artifacts exist
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          cd dist
          test -s androidApp-foss-release.apk || { echo "::error::Required APK artifact missing."; exit 1; }
          test -s *.msi || { echo "::error::Required MSI artifact missing."; exit 1; }
          test -s DORAI-AI-*-Windows-x64.zip || { echo "::error::Required Windows ZIP artifact missing."; exit 1; }
          test -s update.json || { echo "::error::Required update.json artifact missing."; exit 1; }
          echo "All required artifacts (APK, MSI, ZIP, update.json) are present."

      - name: Rename assets to DORAI branding
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          cd dist
          mv androidApp-foss-release.apk "DORAI-AI-v${VERSION}-Android.apk"
          mv *.msi "DORAI-AI-v${VERSION}-windows.msi"
          # Optional artifacts: rename only if present
          for f in androidApp-playStore-release.apk; do [ -e "$f" ] && mv "$f" "DORAI-AI-v${VERSION}-Android-standard.apk" || true; break; done
          for f in *.dmg; do [ -e "$f" ] && mv "$f" "DORAI-AI-v${VERSION}-macos.dmg" || true; break; done
          for f in *.deb; do [ -e "$f" ] && mv "$f" "DORAI-AI-v${VERSION}-linux.deb" || true; break; done
          for f in *.rpm; do [ -e "$f" ] && mv "$f" "DORAI-AI-v${VERSION}-linux.rpm" || true; break; done
          for f in *.AppImage; do [ -e "$f" ] && mv "$f" "DORAI-AI-v${VERSION}-linux.AppImage" || true; break; done
          if [ -f DORAI-AI-linux-x86_64.tar.gz ]; then mv DORAI-AI-linux-x86_64.tar.gz "DORAI-AI-v${VERSION}-linux-x86_64.tar.gz"; fi
          if [ -f DORAI-AI.flatpak ]; then mv DORAI-AI.flatpak "DORAI-AI-v${VERSION}-linux.flatpak"; fi
          ls -la

      - name: Extract changelog
        shell: bash
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## DORAI AI v${VERSION}/,/^## / { /^## DORAI AI v${VERSION}/d; /^## /d; p; }" CHANGELOG.md > dist/changelog.txt
          fi
          if [ ! -s dist/changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^v${VERSION}$" | head -n1)
            if [ -z "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s" -n 20 > dist/changelog.txt
            else
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD" --no-merges > dist/changelog.txt
            fi
          fi
          cat dist/changelog.txt

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum DORAI-AI-* update.json > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          FILES=(
            dist/DORAI-AI-v${VERSION}-Android.apk
            dist/DORAI-AI-v${VERSION}-windows.msi
            dist/DORAI-AI-*-Windows-x64.zip
            dist/update.json
            dist/SHA256SUMS
          )
          # Add any optional artifacts that were successfully built
          for f in dist/DORAI-AI-v${VERSION}-macos.dmg \
                   dist/DORAI-AI-v${VERSION}-linux.deb \
                   dist/DORAI-AI-v${VERSION}-linux.rpm \
                   dist/DORAI-AI-v${VERSION}-linux.AppImage \
                   dist/DORAI-AI-v${VERSION}-linux-x86_64.tar.gz \
                   dist/DORAI-AI-v${VERSION}-linux.flatpak; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done

          gh release create "v${VERSION}" \
            "${FILES[@]}" \
            --title "DORAI v${VERSION}" \
            --notes-file dist/changelog.txt

      - name: Publish canonical update.json to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_PATH="repos/${REPO_OWNER}/${REPO_NAME}/contents/update.json"
          VERSION="${{ needs.preflight.outputs.version }}"
          MANIFEST="dist/update.json"
          APK="dist/DORAI-AI-v${VERSION}-Android.apk"
          test -s "$MANIFEST"
          test -s "$APK"

          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          ASSET_NAME="DORAI-AI-v${VERSION}-Android.apk"
          DOWNLOAD_URL="https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/v${VERSION}/${ASSET_NAME}"
          jq -e \
            --arg version "$VERSION" \
            --arg asset "$ASSET_NAME" \
            --arg url "$DOWNLOAD_URL" \
            --arg sha "$APK_SHA256" \
            '(.schemaVersion == 1) and
             (.packageName == "com.dorai.ai") and
             (.versionName == $version) and
             (.assetName == $asset) and
             (.downloadUrl == $url) and
             (.sha256 == $sha) and
             ((.versionCode | type) == "number") and (.versionCode > 0) and
             ((.signerCertificateSha256 | type) == "string") and
             (.signerCertificateSha256 | test("^[a-f0-9]{64}$"))' \
            "$MANIFEST" >/dev/null
          CANDIDATE_CODE=$(jq -er '.versionCode' "$MANIFEST")

          if CURRENT=$(gh api "$API_PATH?ref=main" 2>/dev/null); then
            CURRENT_CONTENT=$(jq -r '.content // empty' <<<"$CURRENT" | tr -d '\r\n')
            if [[ -z "$CURRENT_CONTENT" ]]; then
              echo "::error::GitHub returned an existing update.json without file content."
              exit 1
            fi
            CURRENT_JSON=$(printf '%s' "$CURRENT_CONTENT" | base64 --decode)
            CURRENT_CODE=$(jq -er '.versionCode | select(type == "number")' <<<"$CURRENT_JSON")
            if (( CURRENT_CODE >= CANDIDATE_CODE )); then
              echo "Canonical manifest is already at versionCode ${CURRENT_CODE}; candidate ${CANDIDATE_CODE} is not newer."
              exit 0
            fi
          else
            echo "No canonical update.json exists on main yet; creating it."
          fi

          # Main is protected by repository rules: publish the manifest via PR + auto-merge.
          BRANCH="chore/update-manifest-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          cp "$MANIFEST" update.json
          git add update.json
          git commit -m "[skip ci] chore(update): publish v${VERSION} manifest"
          git push origin "HEAD:refs/heads/${BRANCH}"

          PR_URL=$(gh pr create \
            --repo "${REPO_OWNER}/${REPO_NAME}" \
            --base main --head "$BRANCH" \
            --title "chore(update): publish v${VERSION} manifest" \
            --body "Canonical update.json for DORAI v${VERSION} (versionCode ${CANDIDATE_CODE}). Created by the release workflow.")

          sleep 5
          if ! gh pr merge "$BRANCH" --repo "${REPO_OWNER}/${REPO_NAME}" --merge; then
            echo "::warning::Automatic merge of the update-manifest PR was blocked by repository rules. Merge ${PR_URL} manually."
          fi
          echo "Published canonical update.json for DORAI v${VERSION}."

  play-store:
    name: Upload AAB to Play Store
    needs: [preflight, release]
    if: ${{ vars.DORAI_PLAY_STORE_ENABLED == 'true' }}
    uses: ./.github/workflows/play-store.yml
    with:
      ref: v${{ needs.preflight.outputs.version }}
    secrets: inherit
