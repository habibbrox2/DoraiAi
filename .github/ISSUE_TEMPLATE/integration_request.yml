name: Integration Request
description: Request support for a new provider, tool, or service in DORAI AI
labels: ["integration"]
body:
  - type: input
    id: name
    attributes:
      label: Provider / Tool / Service Name
      placeholder: e.g. Example AI Provider
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Website or Documentation URL
      placeholder: e.g. https://example.com/docs
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does this integration provide, and why should DORAI AI support it?
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API / Data Source
      description: Links to public API documentation or data sources, if known
    validations:
      required: false
  - type: checkboxes
    id: policy
    attributes:
      label: Policy
      options:
        - label: This integration does not violate any terms of service or platform policies
          required: true
